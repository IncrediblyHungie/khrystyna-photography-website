<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>scrollshot</title>
<style>html,body{margin:0;background:#fff}iframe{width:390px;height:844px;border:0;display:block}</style>
</head><body>
<iframe id="f" src="/elopements.html"></iframe>
<script>
var y = parseInt(location.hash.replace('#','')) || 0;
document.getElementById('f').onload = function(){
  var w = document.getElementById('f').contentWindow;
  setTimeout(function(){ w.scrollTo(0, y); }, 1200);
  setTimeout(function(){ w.scrollTo(0, y); }, 3000);
};
</script>
</body></html>
